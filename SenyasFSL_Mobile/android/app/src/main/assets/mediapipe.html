<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>SenyasFSL Hands</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
</head>
<body style="margin:0;overflow:hidden;">
  <video id="video" autoplay playsinline style="width:100%; height:100%; object-fit:cover; background:black;"></video>
  <canvas id="output" style="position:absolute; top:0; left:0; width:100%; height:100%;"></canvas>

  <script>
    const videoElement = document.getElementById("video");
    const canvasElement = document.getElementById("output");
    const canvasCtx = canvasElement.getContext("2d");

    let sequence = [];

    function sendToRN(data) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(data));
      }
    }

    const hands = new Hands({
      locateFile: (file) =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7,
    });

    hands.onResults((results) => {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        // Flatten landmarks for backend
        const lm = results.multiHandLandmarks[0].flatMap(p => [p.x, p.y, p.z]);
        sequence.push(lm);

        if (sequence.length === 30) {
          fetch("http://192.168.0.107:8000/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sequence }),
          })
          .then(res => res.json())
          .then(pred => {
            sendToRN(pred); // send back prediction to React Native
          })
          .catch(err => console.error(err));

          sequence = []; // reset after sending
        }
      }

      canvasCtx.restore();
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480,
    });
    camera.start();
  </script>
</body>
</html>
